# CI mínima: corre la suite de tests del backend (unittest, SQLite en memoria,
# sin red ni servicios externos) en cada push/PR. Python 3.11 = mismo runtime
# que el Dockerfile del backend.
name: CI

on:
  push:
    branches: [main, develop, staging]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      # -s tests explícito: descubre solo backend/tests/ (aislados y deterministas).
      - name: Tests
        run: python -m unittest discover -s tests -v
